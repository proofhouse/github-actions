---
default_stages: [pre-commit, pre-push]

# Hooks never touch Vale's synced style packages; that content is
# upstream and not reformatted to match this project's style.
exclude: ^\.vale/(Google|write-good|proselint|ai-tells.*)/

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        entry: yamllint -c .yamllint.yaml --strict
        types: [yaml]

  - repo: https://github.com/errata-ai/vale
    rev: f544f4923eb1c7d322c18e35f96333ef8ac29efa  # frozen: v3.13.1
    hooks:
      # Scope the hook to Markdown, the only file type .vale.ini
      # configures rules for in this repo. Extend types_or when .vale.ini
      # grows a new section.
      - id: vale
        types_or: [markdown]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 9f07a8f89dc360f6db3cc0ad9c1953148e9f706f  # frozen: v0.1.44
    hooks:
      - id: rumdl-fmt
      - id: rumdl

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      # Tree-wide spell check at pre-commit and pre-push.
      - id: cspell
        name: cspell
        entry: cspell --config .cspell.jsonc --no-summary --no-progress --no-must-find-files
        language: system
        stages: [pre-commit, pre-push]
        types: [text]
