---
# Install the repository's non-Go lint toolchain, pinned. Mirrors the
# setup-just composite: every workflow that needs these tools consumes
# this action instead of duplicating install blocks, so the verification
# flow stays auditable in one place. Each version default carries a
# trailing `# renovate:` marker so the customManager in
# .github/renovate.json5 tracks it.
#
# Install path per tool, in order of preference (no Homebrew):
#
#   vale, rumdl  — `gh release download` from GitHub releases, with
#                  SHA256 verification. vale ships a goreleaser
#                  `*_checksums.txt`; rumdl (cargo-dist) ships a
#                  per-artifact `*.sha256`.
#   biome        — `gh release download` of the standalone binary.
#                  biome publishes no checksum file with its release
#                  assets, so this pins the version only.
#   cspell       — npm. cspell ships no standalone GitHub-release binary;
#                  npm verifies the registry integrity hash on install.
#   yamllint     — pip. yamllint is published to PyPI only.
#
# Scoped to the runners the lint gates run on: linux/{x64,arm64} and
# macOS/{x64,arm64}. vale and rumdl publish no Windows-arm64 build, so a
# Windows runner is rejected rather than silently half-supported.

name: Setup toolchain
description: Install the pinned non-Go lint toolchain (vale, cspell, rumdl, biome, yamllint).

inputs:
  vale-version:
    description: vale version to install.
    required: false
    default: '3.14.2'  # renovate: datasource=github-releases depName=errata-ai/vale
  rumdl-version:
    description: rumdl version to install.
    required: false
    default: '0.2.4'  # renovate: datasource=github-releases depName=rvben/rumdl
  biome-version:
    description: biome version to install.
    required: false
    default: '2.4.16'  # renovate: datasource=npm depName=@biomejs/biome
  cspell-version:
    description: cspell version to install.
    required: false
    default: '10.0.0'  # renovate: datasource=npm depName=cspell
  yamllint-version:
    description: yamllint version to install.
    required: false
    default: '1.38.0'  # renovate: datasource=pypi depName=yamllint

runs:
  using: composite
  steps:
    - name: Install binary tools (vale, rumdl, biome)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VALE_VERSION: ${{ inputs.vale-version }}
        RUMDL_VERSION: ${{ inputs.rumdl-version }}
        BIOME_VERSION: ${{ inputs.biome-version }}
      run: |
        set -euo pipefail

        if [[ "${RUNNER_OS}" != "Linux" && "${RUNNER_OS}" != "macOS" ]]; then
          echo "setup-toolchain supports Linux and macOS runners only (got ${RUNNER_OS})" >&2
          exit 1
        fi

        # Move a binary onto PATH. /usr/local/bin is writable on the
        # GitHub-hosted Linux and macOS runners without sudo.
        install_bin() { install -m 0755 "$1" "/usr/local/bin/$2"; }

        # Verify a file against an expected sha256. Accepts either a
        # bare-hash file or a "hash  filename" line: take the first field
        # and rebuild the check line locally so the comparison never
        # depends on the recorded filename.
        verify_sha256() {
          local file="$1" sumfile="$2" expected
          expected="$(awk 'NR==1{print $1}' "${sumfile}")"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${expected}" "${file}" | sha256sum -c -
          else
            printf '%s  %s\n' "${expected}" "${file}" | shasum -a 256 -c -
          fi
        }

        # --- vale (gh release + goreleaser checksums.txt) ---
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   vale_asset="vale_${VALE_VERSION}_Linux_64-bit.tar.gz" ;;
          Linux-ARM64) vale_asset="vale_${VALE_VERSION}_Linux_arm64.tar.gz" ;;
          macOS-X64)   vale_asset="vale_${VALE_VERSION}_macOS_64-bit.tar.gz" ;;
          macOS-ARM64) vale_asset="vale_${VALE_VERSION}_macOS_arm64.tar.gz" ;;
          *) echo "unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        vale_sums="vale_${VALE_VERSION}_checksums.txt"
        tmp=$(mktemp -d); pushd "${tmp}" >/dev/null
        gh release download "v${VALE_VERSION}" --repo errata-ai/vale \
          --pattern "${vale_asset}" --pattern "${vale_sums}"
        # checksums.txt lists "<sha256>  <filename>"; verify just our asset.
        grep -E "[ *]${vale_asset}\$" "${vale_sums}" > vale_sums.filtered
        sha256sum -c vale_sums.filtered
        tar -xzf "${vale_asset}"
        install_bin vale vale
        popd >/dev/null; rm -rf "${tmp}"

        # --- rumdl (gh release + per-artifact .sha256) ---
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   rumdl_target="x86_64-unknown-linux-gnu" ;;
          Linux-ARM64) rumdl_target="aarch64-unknown-linux-gnu" ;;
          macOS-X64)   rumdl_target="x86_64-apple-darwin" ;;
          macOS-ARM64) rumdl_target="aarch64-apple-darwin" ;;
          *) echo "unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        # cargo-dist embeds the tag (with the v prefix) in the asset name.
        rumdl_asset="rumdl-v${RUMDL_VERSION}-${rumdl_target}.tar.gz"
        tmp=$(mktemp -d); pushd "${tmp}" >/dev/null
        gh release download "v${RUMDL_VERSION}" --repo rvben/rumdl \
          --pattern "${rumdl_asset}" --pattern "${rumdl_asset}.sha256"
        verify_sha256 "${rumdl_asset}" "${rumdl_asset}.sha256"
        tar -xzf "${rumdl_asset}"
        install_bin rumdl rumdl
        popd >/dev/null; rm -rf "${tmp}"

        # --- biome (gh release, raw binary; no checksum published) ---
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   biome_asset="biome-linux-x64" ;;
          Linux-ARM64) biome_asset="biome-linux-arm64" ;;
          macOS-X64)   biome_asset="biome-darwin-x64" ;;
          macOS-ARM64) biome_asset="biome-darwin-arm64" ;;
          *) echo "unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        tmp=$(mktemp -d); pushd "${tmp}" >/dev/null
        gh release download "@biomejs/biome@${BIOME_VERSION}" --repo biomejs/biome \
          --pattern "${biome_asset}"
        install_bin "${biome_asset}" biome
        popd >/dev/null; rm -rf "${tmp}"

        vale --version
        rumdl --version
        biome --version

    - name: Install cspell (npm)
      shell: bash
      env:
        CSPELL_VERSION: ${{ inputs.cspell-version }}
      run: |
        set -euo pipefail
        npm install -g "cspell@${CSPELL_VERSION}"
        cspell --version

    - name: Install yamllint (pip)
      shell: bash
      env:
        YAMLLINT_VERSION: ${{ inputs.yamllint-version }}
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade "yamllint==${YAMLLINT_VERSION}"
        yamllint --version
