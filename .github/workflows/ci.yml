---
# Main quality gate. This repo's content is workflows, composite actions,
# and the docs around them, so the prose, spelling, Markdown, config, and
# YAML linters are its code gates and run here rather than staying
# local-only as in the Go siblings. The lint job installs the Brewfile
# toolchain (Homebrew is preinstalled on the ubuntu-24.04 runners) and
# syncs the Vale styles, then runs each gate through its `just` recipe so
# the Justfile stays the single definition of what each gate runs.
# actionlint is absent from the list: the standalone lint-workflows
# workflow already covers it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@ffc278f8a5826e61763eb837bb5bc2199a26b86b # v0.2.2

      # The ubuntu-24.04 image ships Homebrew but leaves its prefix off
      # the PATH, so expose the bin and sbin directories before any brew
      # invocation.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # vale comes from the pinned composite rather than the Brewfile:
      # the prose gates are strict enough that an upstream release can
      # move findings without a change here, so the binary is pinned and
      # Renovate-tracked like every other tool. It goes on PATH ahead of
      # Homebrew's prefix, so the Brewfile copy never shadows it.
      - name: Set up vale
        uses: ./.github/actions/setup-vale

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      - name: Install Homebrew dependencies
        run: brew bundle install

      - name: Sync Vale styles
        run: just install-tools

      - name: Lint
        run: |
          just lint-prose
          just lint-spelling
          just lint-markdown
          just lint-config
          just lint-yaml
