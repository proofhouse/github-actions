---
# PR gate that catches broken Renovate config before it lands on main.
# The cron Renovate workflow only runs on schedule, so a malformed config
# on main can sit unnoticed until the next firing. Running the validator
# from the same SHA-pinned image the actual Renovate workflow uses keeps
# the two in lockstep.
#
# This workflow also exposes a `workflow_call` trigger so other org repos
# can validate their Renovate config through it instead of each carrying
# this setup. The job runs the pinned image directly against the tree
# `actions/checkout` lays down — no local action or `just` recipe to drag
# in. The `config_path` input points it at the file to validate and
# defaults to `.github/renovate.json5`; a repo that keeps its config at the
# root passes `config_path: renovate.json5`.
name: Validate Renovate configuration

on:
  pull_request:
    paths:
      # Catch nested renovate configs too if/when subprojects appear.
      - "**renovate.json5"
      # Shared preset files consumed by every proofhouse repo through
      # extends / globalExtends. They don't end in `renovate.json5`, so
      # they need their own patterns.
      - "**renovate-config.json5"
      - "**renovate-global-config.json5"
  workflow_call:
    inputs:
      config_path:
        type: string
        description: "Path to the Renovate config to validate, relative to the repo root"
        default: ".github/renovate.json5"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout configuration
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate configuration
        env:
          CONFIG_PATH: ${{ inputs.config_path || '.github/renovate.json5' }}
        run: |
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          RENOVATE_IMAGE="ghcr.io/renovatebot/renovate:43.205.0@sha256:90fa4f314be425066775a92402f183805134d9c8acd52bcfd120eb7dbe71dd41"
          # Validate the repo config plus any shared preset files present.
          # The presets live only in this repo; workflow_call callers pass
          # their own config_path and carry no presets, so the loop adds
          # nothing there and the original single-file behavior is kept.
          configs=("${CONFIG_PATH}")
          for preset in .github/renovate-config.json5 .github/renovate-global-config.json5; do
            [ -f "${preset}" ] && configs+=("${preset}")
          done
          docker run --rm --entrypoint renovate-config-validator \
            -v "${{ github.workspace }}:/repo" -w /repo \
            "${RENOVATE_IMAGE}" "${configs[@]}"
