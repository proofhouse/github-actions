---
# Lint every workflow under `.github/workflows/` via actionlint, run from
# its SHA-pinned Docker image (which bundles shellcheck). The job fires on
# every PR that touches a workflow file and on every push to `main`, so the
# lint gate guards both ends of the integration path.
#
# This workflow also exposes a `workflow_call` trigger so other repos in the
# org can lint their workflows through it instead of each carrying its own
# actionlint setup. A reusable workflow has to be self-contained: in a called
# workflow a `uses: ./...` local action and any bare `just`/`Justfile`
# reference resolve against the *caller's* checkout, not this repo, so the job
# can't lean on the `setup-just` composite or the `just lint-workflows` recipe.
# It invokes the pinned Docker image directly against whatever tree
# `actions/checkout` lays down — this repo's on push/PR, the caller's on
# `workflow_call`.
#
# The image pin is duplicated from the `actionlint_image` literal in the
# Justfile (the local entrypoint); Renovate's docker datasource keeps both in
# lockstep via the `# renovate:` marker on each.

name: lint-workflows

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          # renovate: datasource=docker depName=rhysd/actionlint
          ACTIONLINT_IMAGE="docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667"
          docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo \
            "${ACTIONLINT_IMAGE}"
